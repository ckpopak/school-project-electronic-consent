server:
  port: ${PORT:8080}

spring:
  application:
    name: electronic-consent
  datasource:
    url: jdbc:h2:mem:econsent;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
